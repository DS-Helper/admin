server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ds-helper-admin
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dshelper?serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

public:
  data:
    portal:
      service:
        key: ${TEST_PUBLIC_DATA_PORTAL_SERVICE_KEY:https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations/LcgvWelfarelist?serviceKey=4b40d9c02c4024d5d3536419a0638d645875c1b353e64075c6de43d192e8a3b3}
