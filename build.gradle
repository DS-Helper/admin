plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	/** JPA **/
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	/** MAIL **/
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	/** THYMELEAF **/
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	/** VALIDATION **/
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	/** SECURITY **/
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	/** WEB */
	implementation 'org.springframework.boot:spring-boot-starter-web'

	/** WEB SOCKET */
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	/** DB */
	runtimeOnly 'mysql:mysql-connector-java:8.0.32'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	/** CONFIGURATION **/
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	/** JJWT **/
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	/** LOMBOK **/
	annotationProcessor 'org.projectlombok:lombok'
	compileOnly 'org.projectlombok:lombok'

	// SWAGGER
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// SPRING CLOUD FOR S3
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

	// S3
	implementation 'software.amazon.awssdk:s3:2.25.32'
	implementation 'org.sejda.imageio:webp-imageio:0.1.6'

	/** TEST */
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = '0.8.12'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			element = 'CLASS'
			includes = [
					'com.project.ds_helper.domain.welfare.controller.AdminWelfareController',
					'com.project.ds_helper.domain.welfare.service.WelfareSyncService',
					'com.project.ds_helper.domain.welfare.service.WelfareDetailSyncParser',
					'com.project.ds_helper.domain.welfare.service.DetailSyncPayload',
					'com.project.ds_helper.domain.post.controller.PostController',
					'com.project.ds_helper.domain.post.service.PostService',
					'com.project.ds_helper.domain.post.entity.Post',
					'com.project.ds_helper.domain.post.entity.PostImage',
					'com.project.ds_helper.domain.post.dto.request.CreatePostReqDto',
					'com.project.ds_helper.domain.post.dto.request.UpdatePostReqDto',
					'com.project.ds_helper.domain.post.dto.response.GetPostResDto',
					'com.project.ds_helper.domain.post.dto.response.GetAllPostOfUserResDto',
					'com.project.ds_helper.domain.post.util.ImageCompressionUtil',
					'com.project.ds_helper.domain.post.util.ImageUtil',
					'com.project.ds_helper.domain.post.util.S3Util',
					'com.project.ds_helper.domain.post.util.WebpImageWriteParamConfigurer',
					'com.project.ds_helper.domain.post.util.WebpImageWriterProvider',
					'com.project.ds_helper.domain.board.controller.BoardController',
					'com.project.ds_helper.domain.board.controller.BoardLikeController',
					'com.project.ds_helper.domain.board.controller.BoardScrapController',
					'com.project.ds_helper.domain.board.dto.response.CreateBoardResponseDto',
					'com.project.ds_helper.domain.board.dto.response.GetBoardByIdResponseDto',
					'com.project.ds_helper.domain.board.dto.response.GetBoardsByCategoryResponseDto.Board',
					'com.project.ds_helper.domain.board.dto.response.GetLikedBoardsResponseDto.Board',
					'com.project.ds_helper.domain.board.dto.response.GetMyBoardsResponseDto',
					'com.project.ds_helper.domain.board.dto.response.GetScrappedBoardsResponseDto.Board',
					'com.project.ds_helper.domain.board.entity.Board',
					'com.project.ds_helper.domain.board.entity.BoardImage',
					'com.project.ds_helper.domain.board.entity.BoardLike',
					'com.project.ds_helper.domain.board.entity.BoardScrap',
					'com.project.ds_helper.domain.board.enums.BoardCategory',
					'com.project.ds_helper.domain.board.service.BoardLikeService',
					'com.project.ds_helper.domain.board.service.BoardScrapService',
					'com.project.ds_helper.domain.board.service.BoardService',
					'com.project.ds_helper.domain.board.service.BoardService.BoardImageUpdatePlan',
					'com.project.ds_helper.domain.board.service.BoardService.ImageUploadBatch',
					'com.project.ds_helper.domain.trashbin.controller.TrashBinController',
					'com.project.ds_helper.domain.trashbin.dto.response.GetTrashBinsResponseDto.TrashBinItem',
					'com.project.ds_helper.domain.trashbin.dto.response.UploadTrashBinImageResponseDto',
					'com.project.ds_helper.domain.trashbin.dto.response.UploadTrashBinImagesResponseDto',
					'com.project.ds_helper.domain.trashbin.dto.response.UploadTrashBinsResponseDto',
					'com.project.ds_helper.domain.trashbin.entity.TrashBin',
					'com.project.ds_helper.domain.trashbin.entity.TrashBinImage',
					'com.project.ds_helper.domain.trashbin.service.TrashBinService',
					'com.project.ds_helper.domain.user.entity.User',
					'com.project.ds_helper.domain.user.service.UserLoginHistoryService'
			]

			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}

			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}

			limit {
				counter = 'METHOD'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
		}
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

tasks.named('jar') {
	enabled = false;
}
